<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今年の運勢</title>
    <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
            background: #F5F5F0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            font-size: 2em;
            color: #666;
            margin-bottom: 40px;
            font-weight: normal;
        }

        .content-box {
            background: #FAFAF8;
            padding: 60px 40px;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .initial-view {
            width: 100%;
            text-align: center;
        }

        .happy-new-year {
            font-size: 2.5em;
            color: #888;
            margin-bottom: 30px;
            font-weight: normal;
            letter-spacing: 0.1em;
        }

        .main-image {
            width: 90%;
            max-width: 550px;
            height: auto;
            margin: 0 auto;
            display: block;
        }

        .gacha-text {
            font-size: 1.5em;
            color: #888;
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .fortune-card {
            width: 100%;
            opacity: 0;
            animation: slideUp 0.8s ease-out forwards;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fortune-image {
            width: 90%;
            max-width: 550px;
            height: auto;
            margin: 0 auto 30px;
            display: block;
        }

        .fortune-text {
            font-size: 1.3em;
            color: #666;
            line-height: 2;
            white-space: pre-line;
        }

        /* タイトル部分（【】）を太字＋少し大きく */
        .fortune-text::first-line {
            font-weight: bold;
            font-size: 1.15em;
            color: #555;
        }

        .fortune-image {
            opacity: 0;
            transition: opacity 0.3s ease-in;
        }

        .fortune-image.loaded {
            opacity: 1;
        }

        .button {
            background: #888;
            color: white;
            border: none;
            padding: 18px 50px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 40px;
        }

        .button:hover {
            background: #666;
        }

        .button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .share-button {
            background: #06C755;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background 0.3s ease;
            margin-top: 30px;
            display: none;
            align-items: center;
            gap: 12px;
        }

        .share-button:hover {
            background: #05A846;
        }

        .share-button.visible {
            display: flex;
        }

        .profile-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            h1 {
                font-size: 1.5em;
                margin-bottom: 25px;
            }

            .content-box {
                padding: 30px 20px;
                min-height: 300px;
            }

            .happy-new-year {
                font-size: 1.5em;
                margin-bottom: 20px;
            }

            .main-image {
                width: 85%;
                max-width: 450px;
            }

            .gacha-text {
                font-size: 1.2em;
            }

            .fortune-image {
                width: 85%;
                max-width: 450px;
            }

            .fortune-text {
                font-size: 1.2em;
                line-height: 1.9;
            }

            .button {
                padding: 15px 35px;
                font-size: 1em;
                margin-top: 25px;
            }

            .share-button {
                padding: 12px 25px;
                font-size: 1em;
                margin-top: 20px;
            }

            .profile-icon {
                width: 35px;
                height: 35px;
            }
        }

        @media (max-width: 400px) {
            h1 {
                font-size: 1.3em;
                margin-bottom: 20px;
            }

            .content-box {
                padding: 25px 15px;
                min-height: 250px;
            }

            .happy-new-year {
                font-size: 1.2em;
                margin-bottom: 15px;
            }

            .main-image {
                width: 80%;
                max-width: 350px;
            }

            .fortune-image {
                width: 80%;
                max-width: 350px;
            }

            .fortune-text {
                font-size: 1.1em;
            }

            .button {
                padding: 12px 30px;
                font-size: 0.95em;
            }

            .share-button {
                padding: 10px 20px;
                font-size: 0.9em;
            }

            .profile-icon {
                width: 30px;
                height: 30px;
            }
        }
    </style>
</head>
<body>
    <div class="container">

        <div class="content-box" id="contentBox">
            <div class="initial-view">
                <div class="happy-new-year">HAPPY NEW YEAR</div>
                <img src="images/main.jpg" alt="富士山" class="main-image">
            </div>
        </div>

        <div class="button-container">
            <button class="button" id="drawButton" onclick="startGacha()">今年の運勢を占う</button>
            <button class="share-button" id="shareButton" onclick="shareToLine()">
                <img src="images/line-profile.jpg" alt="プロフィール" class="profile-icon">
                <span>公式アカウントに共有</span>
            </button>
        </div>
    </div>

    <script>
        // LIFF ID（ここにあなたのLIFF IDを設定してください）
        const LIFF_ID = '2008804421-qXBqLT62';

        // 画像をプリロード
        function preloadImages() {
            const images = [
                'images/main.jpg',
                'images/01.jpg', 'images/02.jpg', 'images/03.jpg', 'images/04.jpg', 'images/05.jpg',
                'images/06.jpg', 'images/07.jpg', 'images/08.jpg', 'images/09.jpg', 'images/10.jpg'
            ];

            images.forEach(src => {
                const img = new Image();
                img.src = src;
            });
        }

        // LIFF初期化
        window.addEventListener('DOMContentLoaded', () => {
            // 画像を事前読み込み
            preloadImages();

            liff.init({
                liffId: LIFF_ID
            }).then(() => {
                console.log('LIFF initialized');
            }).catch((err) => {
                console.error('LIFF initialization failed', err);
            });
        });

        const fortunes = [
            {
                title: 'たくさんのアイスに出会えるでしょう',
                image: 'images/01.jpg',
                text: `【たくさんのアイスに出会えるでしょう】
今年は春夏秋冬、たくさんアイスが食べられるでしょう。
お気に入りアイスを見つけたら、私にも教えてね〜！`
            },
            {
                title: '今年のラッキー果物はりんごです',
                image: 'images/02.jpg',
                text: `【今年のラッキー果物はりんごです】
色も形もいろんなりんごを選んで食べてみると良いことあるかも。りんごのお菓子やお料理もオススメだよ🍎✨`
            },
            {
                title: '早く寝ると良いことありそう',
                image: 'images/03.jpg',
                text: `【早く寝ると良いことありそう】
このアプリに「早く寝ようクーポン」もあるからたくさん使ってね！`
            },
            {
                title: 'コンビニでお気に入りの商品に出会える',
                image: 'images/04.jpg',
                text: `【コンビニでお気に入りの商品に出会える】
今年はコンビニにでお気に入りの商品に
たくさん出会えるでしょう。
オススメ商品、私にも報告してね！`
            },
            {
                title: 'どうでもいいことで笑うことがたくさんありそう',
                image: 'images/05.jpg',
                text: `【どうでもいいことで
笑うことがたくさんありそう】
その笑い、大事にしてね。`
            },
            {
                title: '寄り道した先で楽しい時間が見つかる',
                image: 'images/06.jpg',
                text: `【寄り道した先で楽しい時間が見つかる】今年は、ちょっと寄り道した先で
思いがけず楽しい時間が
見つかりそうです。`
            },
            {
                title: '何かを食べている時間が増える',
                image: 'images/07.jpg',
                text: `【何かを食べている時間が増える】
今年は、気づいたら何かを食べている時間が増えそう。
おいしいものにたくさう出会えるといいね。
気に入ったものがあったら、私にも教えてね！`
            },
            {
                title: '天気予報を意識すると運勢UP',
                image: 'images/08.jpg',
                text: `【天気予報を意識すると運勢UP】
今年は、天気を考えないで外に出て
ちょっと後悔する日がありそう。
天気予報を見ると、物事がスムーズにいくかもね。`
            },
            {
                title: '機嫌よく過ごせる日が多そう',
                image: 'images/09.jpg',
                text: `【機嫌よく過ごせる日が多そう】
今年は、理由はよく分からないけど
なんとなく機嫌よく過ごせる日が増えそうです。`
            },
            {
                title: '選んだものが正解になる',
                image: 'images/10.jpg',
                text: `【選んだものが正解になる】
今年は、何気なく選んだものが
あとから「これでよかったな」って思えることがありそう。`
            }
        ];

        const gachaTexts = [
            '２０２６年の運勢は…',
            'そろそろ出るよ〜…'
        ];

        let isDrawing = false;
        let currentFortuneText = '';
        let currentFortuneTitle = '';

        function startGacha() {
            if (isDrawing) return;

            isDrawing = true;
            const button = document.getElementById('drawButton');
            const contentBox = document.getElementById('contentBox');

            button.disabled = true;

            let currentTextIndex = 0;

            function showNextGachaText() {
                if (currentTextIndex < gachaTexts.length) {
                    contentBox.innerHTML = `<div class="gacha-text">${gachaTexts[currentTextIndex]}</div>`;
                    currentTextIndex++;
                    setTimeout(showNextGachaText, 800);
                } else {
                    showFortune();
                }
            }

            showNextGachaText();
        }

        function showFortune() {
            const contentBox = document.getElementById('contentBox');
            const button = document.getElementById('drawButton');
            const shareButton = document.getElementById('shareButton');

            // ランダムに運勢を選択
            const randomFortune = fortunes[Math.floor(Math.random() * fortunes.length)];
            currentFortuneText = randomFortune.text;
            currentFortuneTitle = randomFortune.title;

            contentBox.innerHTML = `
                <div class="fortune-card">
                    <img src="${randomFortune.image}" alt="今年の運勢" class="fortune-image">
                    <div class="fortune-text">${randomFortune.text}</div>
                </div>
            `;

            // 画像読み込み完了後にフェードイン
            const fortuneImg = contentBox.querySelector('.fortune-image');
            fortuneImg.onload = () => {
                fortuneImg.classList.add('loaded');
            };
            // すでにキャッシュされている場合
            if (fortuneImg.complete) {
                fortuneImg.classList.add('loaded');
            }

            button.disabled = false;
            isDrawing = false;

            // 共有ボタンを表示
            shareButton.classList.add('visible');
        }

        // LINE共有機能（公式アカウントのトークに送信）
        function shareToLine() {
            // デバッグ情報を出力
            console.log('LIFF状態:');
            console.log('- isLoggedIn:', liff.isLoggedIn());
            console.log('- isInClient:', liff.isInClient());
            console.log('- 現在のURL:', window.location.href);

            if (!liff.isLoggedIn()) {
                liff.login();
                return;
            }

            // sendMessagesが使えるか確認
            if (!liff.isInClient()) {
                alert('この機能はLINEアプリ内でのみ利用できます\n\n【デバッグ情報】\nLIFF URLで開いてください:\nhttps://liff.line.me/2008804421-qXBqLT62');
                return;
            }

            liff.sendMessages([
                {
                    type: 'text',
                    text: `今年の運勢：${currentFortuneTitle}`
                }
            ]).then(() => {
                alert('公式アカウントに送信しました！');
                console.log('共有完了');
            }).catch((error) => {
                console.error('共有エラー詳細:', error);
                let errorMsg = '共有に失敗しました';
                if (error.code === 'UNAUTHORIZED') {
                    errorMsg = 'アプリの権限が不足しています。LIFF設定を確認してください。';
                } else if (error.message) {
                    errorMsg = `エラー: ${error.message}`;
                }
                alert(errorMsg);
            });
        }
    </script>
</body>
</html>
